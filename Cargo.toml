[package]
publish = true

name = "ethos-bitcoind"
version = "32.0.0"
edition = "2021"
authors = ["Ethos Developers"]
license = "CC0-1.0"
description = "Generated client for ethos-bitcoind."
readme = "README.md"
keywords = ["bitcoin", "protocol", "compiler", "integration-testing"]
categories = ["cryptography", "data-structures", "api-bindings"]
repository = "https://github.com/nervana21/ethos"
homepage = "https://github.com/nervana21/ethos"
documentation = "https://docs.rs/ethos-bitcoind"

[dependencies]
bitcoin = { version = "0.32.8", default-features = false, features = ["std", "serde"] }
bitcoin-units = { version = "0.3.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }

# Optional client / node-manager stack (feature = "client")
async-trait = { version = "0.1.89", optional = true }
base64 = { version = "0.22", optional = true }
bitreq = { version = "0.3.7", default-features = false, features = ["async-https"], optional = true }
bytes = { version = ">=1.11.1", optional = true }  # RUSTSEC-2026-0007: Integer overflow in BytesMut::reserve (tokio transitive)
rustls = { version = ">=0.23.45", optional = true }  # RUSTSEC-2026-0285: TLS 1.3 handshake across encryption levels (bitreq transitive)
tempfile = { version = "3.23.0", optional = true }
thiserror = { version = "2.0.17", optional = true }
tokio = { version = "1.49", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { version = "0.1.41", optional = true }
# Optional OpenRPC Draft 7 wire validation (feature = "schema-validate")
jsonschema = { version = "0.56", default-features = false, optional = true }

[features]
default = ["client", "blockchain", "core", "network", "rawtransaction", "util"]
types = []
client = ["dep:async-trait", "dep:base64", "dep:bitreq", "dep:bytes", "dep:rustls", "dep:tempfile", "dep:thiserror", "dep:tokio", "dep:tracing"]
blockchain = []
control = []
core = []
mining = []
network = []
rawtransaction = []
signer = []
util = []
wallet = []
zmq = []

# Enable all features
full = ["blockchain", "client", "control", "core", "mining", "network", "rawtransaction", "signer", "types", "util", "wallet", "zmq"]
serde-deny-unknown-fields = []
schema-validate = ["client", "dep:jsonschema"]

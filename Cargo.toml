[package]
publish = true

name = "ethos-bitcoind"
version = "30.2.2"
edition = "2021"
authors = ["Ethos Developers"]
license = "CC0-1.0"
description = "Generated client for ethos-bitcoind."
readme = "README.md"
keywords = ["bitcoin", "protocol", "compiler", "integration-testing"]
categories = ["cryptography", "data-structures", "api-bindings"]
repository = "https://github.com/nervana21/ethos"
homepage = "https://github.com/nervana21/ethos"
documentation = "https://docs.rs/ethos-bitcoind"

[workspace]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22"
bitcoin = { version = "0.32.8", features = ["rand", "serde"] }
bitreq = { version = "0.3.1", default-features = false, features = ["async-https"] }
bytes = ">=1.11.1"  # RUSTSEC-2026-0007: Integer overflow in BytesMut::reserve (tokio transitive)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.41"


[features]
default = ["blockchain", "core", "network", "rawtransaction", "util"]
blockchain = []
control = []
core = []
mining = []
network = []
rawtransaction = []
signer = []
util = []
wallet = []

# Enable all features
full = ["blockchain", "control", "core", "mining", "network", "rawtransaction", "signer", "util", "wallet"]
serde-deny-unknown-fields = []
